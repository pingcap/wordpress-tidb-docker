global
    maxconn 64
    nbthread 1

defaults
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout client-fin 1s
    timeout server-fin 1s

resolvers docker
    nameserver embedded 127.0.0.11:53
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s

listen database
    bind ":${TIDB_PORT}"
    # No destination or protocol is selected from client-supplied bytes.
    server gateway database-gateway:3307 resolvers docker init-addr none

frontend readiness
    bind 127.0.0.1:8404
    mode http
    http-request return status 204
