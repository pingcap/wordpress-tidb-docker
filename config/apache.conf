ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
<VirtualHost *:8080>
    DocumentRoot /opt/wordpress
    <Directory /opt/wordpress>
        Options -Indexes
        AllowOverride None
        # Resolve the Compose service at request time, including after recreate.
        # Backend peers cannot bypass Caddy by supplying forwarded headers.
        Require forward-dns proxy
        RewriteEngine On
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteBase /
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </Directory>
    <Directory /opt/wordpress/wp-content/uploads>
        Options -Indexes -FollowSymLinks -SymLinksIfOwnerMatch -ExecCGI
        RewriteEngine Off
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <Files "healthz.txt">
        Require local
    </Files>
    <FilesMatch "^(wp-config\.php|xmlrpc\.php|wp-cron\.php|debug\.log)$">
        Require all denied
    </FilesMatch>
    # No query string, referer, cookies, username, or request body in access logs.
    LogFormat "%a %t %m %>s %b" privacy
    CustomLog /proc/self/fd/1 privacy
    ErrorLog /proc/self/fd/2
    LogLevel crit
</VirtualHost>
